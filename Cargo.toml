[package]
name = "clipvault"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ClipVault — a calm, private Windows clipboard manager"
license = "MIT"
authors = ["Manuel"]
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
bitflags = "2.13.2"
chrono = { version = "0.4.45", features = ["clock"] }
dirs = "7.0.0"
flume = "0.12.0"
iced = { version = "0.13.1", features = ["image", "svg"] }
image = { version = "0.25.9", features = ["png"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_GdiPlus", "Win32_Security"] }
windows-registry = "0.6.1"

[build-dependencies]
winres = "0.1.12"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
